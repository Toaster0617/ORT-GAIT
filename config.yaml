network:
  # IPC sends camera JPEG fragments to this PC address.
  pc_host: "10.192.17.244"
  bind_host: "0.0.0.0"
  camera_udp_port: 7000
  visibility_udp_port: 8001
  quest_image_tcp_port: 8082
  quest_yaw_udp_port: 8084
  udp_chunk_bytes: 1200
  reassembly_timeout_s: 0.25
  max_camera_jpeg_bytes: 4194304

capture:
  width: 1280
  height: 720
  fps: 30
  jpeg_quality: 90

stitch:
  panorama_size: [4350, 740]
  weight_exponent: 6.5
  output_jpeg_quality: 80
  # QuestDemo/ImageReceiver.cs currently allocates a 1 MiB receive buffer.
  max_output_jpeg_bytes: 1048576

dynamic:
  pixel_difference_threshold: 30
  # The former value 0 made every frame pass. 0.10 keeps the same entropy
  # algorithm while allowing truly static regions to be skipped.
  entropy_threshold: 0.10

runtime:
  base_yaw_deg: -30.0
  headset_fov_deg: 80.0
  processing_fps: 30.0
  visibility_heartbeat_s: 0.5
  preview: false

